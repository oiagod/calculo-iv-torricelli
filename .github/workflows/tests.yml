name: tests

on:
  push:
  pull_request:

jobs:
  simulador:
    name: Física do simulador (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  analise:
    name: Análise dos vídeos (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: analise/requirements.txt
      - run: pip install -r analise/requirements.txt
      - run: pytest analise/tests
